[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-discord-civilization"
version = "0.1.0"
description = "A persistent community civilization simulator for Discord"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["discord.py>=2.4,<3", "aiosqlite>=0.20,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
nexus = "nexus.__main__:main"

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
